<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Guide</title>
<!-- Upgraded SheetJS Library that supports Excel Cell Styling -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
  :root {
    /* --- iOS Light Mode Variables --- */
    --text-main: #000000;
    --text-muted: #8e8e93;
    
    /* Apple Core Colors */
    --accent: #007aff; 
    --danger: #ff3b30;
    
    /* True iOS Glass */
    --glass-bg: rgba(255, 255, 255, 0.65);
    --glass-border: rgba(255, 255, 255, 0.4);
    --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); 
    
    /* iOS standard translucent fill for inputs/pills */
    --fill-color: rgba(118, 118, 128, 0.12); 
    --fill-color-hover: rgba(118, 118, 128, 0.2); 
    
    /* Segmented Control (Tabs) */
    --tab-bg: rgba(118, 118, 128, 0.12);
    --tab-active-bg: #ffffff;
    --tab-active-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04);
    --tab-text: #000000;

    /* Light Image Background */
    --bg-color: #f2f2f7;
    --bg-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');

    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 24px;
  }

  body.dark-mode {
    /* --- iOS Dark Mode Variables --- */
    --text-main: #ffffff;
    --text-muted: #ebebf5;
    
    /* Apple Core Colors (Dark mode variants) */
    --accent: #0a84ff; 
    --danger: #ff453a;
    
    /* True iOS Dark Glass */
    --glass-bg: rgba(30, 30, 30, 0.65);
    --glass-border: rgba(255, 255, 255, 0.15);
    --glass-shadow: 0 10px 50px rgba(0, 0, 0, 0.6);
    
    --fill-color: rgba(118, 118, 128, 0.24); 
    --fill-color-hover: rgba(118, 118, 128, 0.35); 

    /* Segmented Control (Tabs) */
    --tab-bg: rgba(118, 118, 128, 0.24);
    --tab-active-bg: #636366;
    --tab-active-shadow: 0 3px 8px rgba(0,0,0,0.3), 0 3px 1px rgba(0,0,0,0.15);
    --tab-text: #ffffff;

    /* Dark Image Background */
    --bg-color: #000000;
    --bg-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
  }
  
  * { 
    box-sizing: border-box; 
    margin: 0;
    padding: 0;
  }

  body {
    /* Native Apple Fonts */
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    background-image: var(--bg-image);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: stretch; 
    min-height: 100vh;
    padding: clamp(20px, 4vw, 40px) 16px; 
    transition: background-image 0.5s ease, background-color 0.5s ease, color 0.3s ease;
  }

  /* --- Theme Toggle Button --- */
  .theme-toggle {
    position: fixed;
    top: clamp(10px, 3vw, 20px);
    right: clamp(10px, 3vw, 24px);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--glass-bg);
    border: 0.5px solid var(--glass-border);
    /* Heavy iOS Blur & Saturation */
    backdrop-filter: blur(25px) saturate(200%);
    -webkit-backdrop-filter: blur(25px) saturate(200%);
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--glass-shadow);
    transition: all 0.3s ease;
    z-index: 1000;
  }

  .theme-toggle:hover {
    transform: scale(1.05);
    background: var(--fill-color);
  }

  /* --- Main Card (iOS Glass) --- */
  .card {
    width: 100%;
    max-width: 460px; 
    display: flex;
    flex-direction: column; 
    background: var(--glass-bg);
    
    /* Heavy iOS Blur & Saturation */
    backdrop-filter: blur(25px) saturate(200%);
    -webkit-backdrop-filter: blur(25px) saturate(200%);
    
    border: 0.5px solid var(--glass-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--glass-shadow);
    position: relative;
    max-height: 900px; 
    transition: all 0.3s ease;
  }

  /* --- iOS Segmented Control (Tabs) --- */
  .tabs-wrapper {
    padding: 16px 16px 0 16px;
    flex-shrink: 0;
  }

  .tabs {
    display: flex;
    background: var(--tab-bg);
    padding: 3px;
    border-radius: 9px;
    gap: 2px;
  }

  .tab-btn {
    flex: 1;
    padding: 6px 12px;
    text-align: center;
    background: transparent;
    border: none;
    font-size: 13px; 
    font-weight: 600;
    color: var(--text-main);
    cursor: pointer;
    border-radius: 7px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .tab-btn.active {
    background: var(--tab-active-bg);
    color: var(--tab-text);
    box-shadow: var(--tab-active-shadow);
    font-weight: 600;
  }

  /* --- Tab Content --- */
  .tab-content { 
    display: none; 
    flex: 1; 
    flex-direction: column;
    padding: 24px 20px; 
    animation: fadeScale 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .tab-content.active { display: flex; }

  @keyframes fadeScale {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
  }

  .tab-header {
    display: flex;
    flex-shrink: 0;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .tab-header h2 {
    font-size: 22px; 
    margin: 0;
    color: var(--text-main);
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  /* --- Clear Button --- */
  .clear-btn {
    padding: 8px 18px; 
    border-radius: var(--radius-sm);
    border: none;
    background: var(--fill-color);
    color: var(--danger);
    font-size: 14px; 
    font-weight: 600;
    letter-spacing: -0.2px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .clear-btn:hover {
    background: var(--danger);
    color: #fff;
  }

  label {
    display: block;
    font-size: 12px; 
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
    margin-left: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .field { 
    margin-bottom: 16px; 
    flex-shrink: 0; 
  }
  
  .row {
    display: flex;
    flex-shrink: 0;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .row .field { margin-bottom: 0; flex: 1; }
  .row .side-field { flex: 0 0 110px; } 

  /* --- iOS Inputs --- */
  input[type="text"],
  input[type="number"],
  input[type="date"],
  select,
  textarea {
    width: 100%;
    padding: 12px 14px; 
    border: none;
    border-radius: var(--radius-sm);
    /* Changed to 13px to match Notes textarea uniformly */
    font-size: 13px; 
    font-weight: 400;
    background: var(--fill-color);
    color: var(--text-main);
    font-family: inherit;
    /* Added to visually force uppercase immediately */
    text-transform: uppercase;
    transition: all 0.2s ease;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    background: var(--fill-color-hover);
    box-shadow: 0 0 0 2px var(--accent);
  }

  input[readonly] {
    opacity: 0.7;
    font-weight: 600;
  }

  input.invalid {
    box-shadow: 0 0 0 2px var(--danger) !important;
    animation: shake 0.4s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  /* --- Expanding Textarea Logic --- */
  .expand-field {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin-bottom: 0; 
    min-height: 0; 
  }

  textarea {
    /* 13px standard size */
    font-size: 13px; 
    line-height: 1.5;
    resize: none; 
  }

  .expand-field textarea {
    flex: 1; 
  }

  /* --- Pills --- */
  .pills {
    display: flex;
    flex-shrink: 0;
    flex-wrap: wrap;
    gap: 8px; 
    margin: 10px 0 16px;
    padding: 16px 0 0;
    border-top: 0.5px solid var(--glass-border);
  }

  .pill {
    padding: 6px 14px;
    border-radius: 16px;
    border: none;
    background: var(--fill-color);
    color: var(--text-main);
    font-size: 12.5px; 
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .pill:hover { 
    background: var(--fill-color-hover);
  }

  .pill.selected {
    background: var(--accent);
    color: #fff;
    box-shadow: none; 
  }

  .pill.selected[data-name="Delay03"] {
    background: var(--danger);
  }

  /* --- LRP & Email Buttons --- */
  .lrp-row {
    display: flex;
    flex-shrink: 0;
    gap: 12px;
    padding: 0 0 20px;
    border-bottom: 0.5px solid var(--glass-border);
    margin-bottom: 20px;
  }

  .lrp-btn {
    flex: 1;
    padding: 8px; 
    border-radius: var(--radius-sm);
    border: none;
    background: rgba(0, 122, 255, 0.15); 
    color: var(--accent);
    font-size: 12.5px; 
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  body.dark-mode .lrp-btn {
    background: rgba(10, 132, 255, 0.2);
  }

  .lrp-btn:hover {
    background: var(--accent);
    color: #fff;
  }

  .payment-btn {
    background: var(--accent);
    color: #fff;
  }
  .payment-btn:hover { 
    opacity: 0.85;
  }
  
  /* Gradient Pink Rec Button */
  .payment-btn#recBtn {
    background: linear-gradient(135deg, #ff7eb3, #ff4d79);
    color: #fff;
    border: none;
  }
  .payment-btn#recBtn:hover {
    background: linear-gradient(135deg, #ff4d79, #ff7eb3);
    opacity: 0.9;
  }

  /* --- iOS Style Toast Notification --- */
  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(20px) scale(0.9);
    background: rgba(30, 30, 30, 0.75);
    backdrop-filter: blur(20px) saturate(200%);
    -webkit-backdrop-filter: blur(20px) saturate(200%);
    color: #fff;
    padding: 12px 24px;
    border-radius: 999px;
    font-size: 14px; 
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  body.dark-mode .toast {
    background: rgba(220, 220, 220, 0.85);
    color: #000;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }

  /* --- Responsive Layout for Mobile --- */
  @media (max-width: 480px) {
    .row {
      flex-direction: column;
      gap: 12px;
    }
    .row .side-field {
      flex: 1 1 100%;
      width: 100%;
    }
    .tab-content {
      padding: 20px 16px;
    }
    .tab-btn {
      font-size: 11.5px;
    }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle Dark Mode">
  <!-- Sun Icon (Default) -->
  <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
  </svg>
</button>

<div class="card">
  <!-- iOS Segmented Control Tab Wrapper -->
  <div class="tabs-wrapper">
    <div class="tabs">
      <button class="tab-btn active" data-tab="call">Call</button>
      <button class="tab-btn" data-tab="payment">Paid</button>
      <button class="tab-btn" data-tab="th">T&amp;H</button>
    </div>
  </div>

  <!-- CALL TAB -->
  <div class="tab-content active" id="call">
    <div class="tab-header">
      <h2>My Notes</h2>
      <button class="clear-btn" id="clearBtn">Clear</button>
    </div>

    <div class="row">
      <div class="field">
        <label for="totalBalance">Total Balance ($)</label>
        <input type="text" id="totalBalance" placeholder="0.00" inputmode="decimal">
      </div>
      <div class="side-field">
        <label for="months">Term (Mo)</label>
        <select id="months">
          <option value="">--</option>
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option>5</option><option>6</option><option>7</option><option>8</option>
          <option>9</option><option>10</option><option>11</option><option>12</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="monthly">Monthly Due</label>
        <input type="text" id="monthly" placeholder="0.00" readonly>
      </div>
      <div class="side-field">
        <label for="startDate">Start Date</label>
        <input type="date" id="startDate">
      </div>
    </div>

    <div class="pills" id="pillGroup">
      <button class="pill" data-name="VM">Voicemail</button>
      <button class="pill" data-name="No VM">No VM</button>
      <button class="pill" data-name="Agreed">Confirm</button>
      <button class="pill" data-name="Delay03">Del 3</button>
      <button class="pill" data-name="Nil">Nil</button>
      <button class="pill" data-name="Propose">Propose</button>
    </div>

    <div class="lrp-row">
      <button class="lrp-btn" id="lrpBtn">LRP</button>
      <button class="lrp-btn" id="emailBtn">Email</button>
    </div>

    <!-- Expanding Field ensures textarea fills bottom space -->
    <div class="field expand-field">
      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="..."></textarea>
    </div>
  </div>

  <!-- PAYMENT TAB -->
  <div class="tab-content" id="payment">
    <div class="tab-header">
      <!-- Initials input retains custom 14px size distinctly -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <h2>PD</h2>
        <input type="text" id="pdInitials" maxlength="5" placeholder="Initials" style="width: 80px; padding: 6px; font-size: 14px; text-transform: uppercase;">
      </div>
      <button class="clear-btn" id="clearPaymentBtn">Clear</button>
    </div>

    <!-- Added expand-field here and inline margin to separate from the fields below -->
    <div class="field expand-field" style="margin-bottom: 16px;">
      <label for="paymentNotes">Notes</label>
      <textarea id="paymentNotes" placeholder="..."></textarea>
    </div>

    <!-- Added From, Agent, and Code inputs (Swapped per user request) -->
    <div class="row">
      <div class="field">
        <label for="fromField">From</label>
        <input type="text" id="fromField" placeholder="...">
      </div>
      <div class="field">
        <label for="agentField">Agent</label>
        <input type="text" id="agentField" placeholder="...">
      </div>
      <div class="field">
        <label for="codeField">Code</label>
        <input type="text" id="codeField" placeholder="...">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <!-- Clarified label to indicate it's for Name -->
        <label for="upField">UP (Name)</label>
        <input type="text" id="upField" placeholder="...">
      </div>
      <div class="field">
        <!-- Clarified label to indicate 10 digits -->
        <label for="pidField">PID Code (10-Digit Primary ID)</label>
        <input type="text" id="pidField" placeholder="Code" inputmode="numeric">
      </div>
    </div>
    
    <!-- Added Calendar Selection below PID Code -->
    <div class="row">
      <div class="field">
        <label for="paymentDateBtn">Payment Date</label>
        <input type="date" id="paymentDateBtn">
      </div>
    </div>

    <div class="pills" id="paymentBtnGroup" style="border-top:none; padding-top:0;">
      <button class="pill payment-btn" id="normBtn" data-name="NORM">Copy Normal</button>
      <button class="pill payment-btn" id="recBtn" data-name="REC">Copy Rec</button>
      <!-- New Dedicated Save to Tracker Button -->
      <button class="pill payment-btn" id="savePaymentTrackerBtn" style="background: linear-gradient(135deg, #34c759, #28a745); color: #fff; border: none; margin-left: auto;">Save to Tracker</button>
    </div>
    
    <!-- Excel & Reset Actions for Paid Tab -->
    <div class="row" style="margin-top: 10px; margin-bottom: 0px; border-top: 0.5px solid var(--glass-border); padding-top: 16px;">
      <button class="pill payment-btn" id="downloadPaymentExcelBtn" style="flex: 1; text-align: center;">📊 Download Excel</button>
      <button class="clear-btn" id="resetPaymentTrackerBtn" style="background: var(--danger); color: white; padding: 6px 12px; font-size: 13px;">Reset Data</button>
    </div>
  </div>

  <!-- T&H TAB -->
  <div class="tab-content" id="th">
    <div class="tab-header">
      <h2>T&amp;H</h2>
      <button class="clear-btn" id="clearThBtn">Clear</button>
    </div>
    
    <div class="field expand-field">
      <label for="thNotes">Notes</label>
      <textarea id="thNotes" placeholder="..."></textarea>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
  <span id="toastMsg"></span>
</div>

<script>
  // ---------- Auto-Uppercase Force Listener ----------
  // This physically alters the backend value of the text boxes/text areas to uppercase as you type or paste
  document.addEventListener('input', (e) => {
    if ((e.target.tagName === 'INPUT' && e.target.type === 'text') || e.target.tagName === 'TEXTAREA') {
      const start = e.target.selectionStart;
      const end = e.target.selectionEnd;
      const upper = e.target.value.toUpperCase();
      if (e.target.value !== upper) {
        e.target.value = upper;
        try {
          // Attempt to keep the user's cursor exactly where it was before the capitalization replacement
          e.target.setSelectionRange(start, end);
        } catch(err) {}
      }
    }
  });

  // ---------- Dark Mode Toggle ----------
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  
  themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    
    if (document.body.classList.contains('dark-mode')) {
      themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
    } else {
      themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    }
  });

  // ---------- Tab switching ----------
  const tabBtns = document.querySelectorAll('.tab-btn');
  const tabContents = document.querySelectorAll('.tab-content');
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  // ---------- Field refs ----------
  const totalBalanceEl = document.getElementById('totalBalance');
  const monthsEl = document.getElementById('months');
  const monthlyEl = document.getElementById('monthly');
  const startDateEl = document.getElementById('startDate');
  const notesEl = document.getElementById('notes');
  const toastEl = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  const paymentNotesEl = document.getElementById('paymentNotes');
  const upFieldEl = document.getElementById('upField');
  const pidFieldEl = document.getElementById('pidField');
  const thNotesEl = document.getElementById('thNotes');
  
  // Paid Tab specific fields
  const fromFieldEl = document.getElementById('fromField');
  const codeFieldEl = document.getElementById('codeField');
  const agentFieldEl = document.getElementById('agentField');
  const paymentDateBtnEl = document.getElementById('paymentDateBtn');
  const pdInitialsEl = document.getElementById('pdInitials');

  // Ensure PID Field only accepts numbers AND shakes red when letters are typed/pasted
  pidFieldEl.addEventListener('input', () => {
    const original = pidFieldEl.value;
    const cleaned = original.replace(/\D/g, ''); // Remove non-numeric characters
    
    if (cleaned !== original) {
      pidFieldEl.value = cleaned;
      
      // Trigger the shake animation
      pidFieldEl.classList.remove('invalid');
      void pidFieldEl.offsetWidth; // Force a reflow
      pidFieldEl.classList.add('invalid');
      
      clearTimeout(pidFieldEl._invalidTimer);
      pidFieldEl._invalidTimer = setTimeout(() => {
        pidFieldEl.classList.remove('invalid');
      }, 700);
    }
  });

  // ---------- Start Date: always defaults to 10 days from today ----------
  function formatDateInput(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function getDatePlus10() {
    const d = new Date();
    d.setDate(d.getDate() + 10);
    return d;
  }
  function resetStartDate() {
    const plus10 = formatDateInput(getDatePlus10());
    startDateEl.value = plus10;
    startDateEl.min = plus10;
  }
  resetStartDate();

  // ---------- Auto compute Monthly = Total Balance / Months ----------
  function computeMonthly() {
    const total = parseFloat(totalBalanceEl.value);
    const months = parseInt(monthsEl.value, 10);
    if (!isNaN(total) && !isNaN(months) && months > 0) {
      const rawMonthly = total / months;
      
      // Safely round UP to the nearest cent (2 decimal places)
      const roundedMonthly = Number(Math.ceil(rawMonthly + 'e2') + 'e-2');
      
      monthlyEl.value = roundedMonthly.toFixed(2);
    } else {
      monthlyEl.value = '';
    }
  }
  totalBalanceEl.addEventListener('input', () => {
    const original = totalBalanceEl.value;
    const cleaned = original.replace(/[^0-9.]/g, '');
    if (cleaned !== original) {
      totalBalanceEl.value = cleaned;
      totalBalanceEl.classList.remove('invalid');
      void totalBalanceEl.offsetWidth;
      totalBalanceEl.classList.add('invalid');
      clearTimeout(totalBalanceEl._invalidTimer);
      totalBalanceEl._invalidTimer = setTimeout(() => {
        totalBalanceEl.classList.remove('invalid');
      }, 700);
    }
    computeMonthly();
  });
  monthsEl.addEventListener('change', computeMonthly);

  // ---------- Toast ----------
  let toastTimer;
  function showToast(msg) {
    clearTimeout(toastTimer);
    toastMsg.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('Copied to clipboard');
    }).catch(() => {
      showToast('Could not copy — copy manually');
    });
  }

  // ---------- Formatted values for messages ----------
  function getMonthsVal() { return monthsEl.value || '[months]'; }
  function getAmountVal() { return monthlyEl.value || '[amount]'; }
  function getDateVal() {
    if (!startDateEl.value) return '[start date]';
    const d = new Date(startDateEl.value + 'T00:00:00');
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  const TRAILING_SENTENCE = 'PLEASE CHANGE TO ANALYST REPAY ONCE CONFIRMATION/PAYMENT HAS BEEN RECEIVED.';

  const pillMessages = {
    'VM': () => `UNABLE TO REACH THE AGENT. LEFT VM INSTEAD. SENT A PAYMENT PLAN PROPOSAL EMAIL FOR ${getMonthsVal()} MONTHS, AMOUNTING TO $${getAmountVal()}, AND STARTING ON ${getDateVal().toUpperCase()}. ${TRAILING_SENTENCE}`,
    'No VM': () => `UNABLE TO REACH THE AGENT. SENT A PAYMENT PLAN PROPOSAL EMAIL FOR ${getMonthsVal()} MONTHS, AMOUNTING TO $${getAmountVal()}, AND STARTING ON ${getDateVal().toUpperCase()}. ${TRAILING_SENTENCE}`,
    'Agreed': () => `REACHED AN AGREEMENT OF A REPAYMENT PLAN FOR ${getMonthsVal()} MONTHS, AMOUNTING TO $${getAmountVal()}, AND STARTING ON ${getDateVal().toUpperCase()}. SENT CONFIRMATION EMAIL.`,
    'Nil': () => `REPAYMENT PLAN NO LONGER NEEDED FOR OUTSTANDING BALANCE IS NIL.`,
    'Delay03': () => `STILL UNABLE TO REACH AGENT AFTER DEL3. CHANGED WORK ITEM STATUS TO CALLCLOSED. SENT EMAIL FOLLOW-UP TO CONFIRM REPAY PLAN FOR ${getMonthsVal()} MONTHS, AMOUNTING TO $${getAmountVal()}, AND STARTING ON ${getDateVal().toUpperCase()}. ${TRAILING_SENTENCE}`,
    'Propose': () => `SENT A PAYMENT PLAN PROPOSAL EMAIL FOR ${getMonthsVal()} MONTHS, AMOUNTING TO $${getAmountVal()}, AND STARTING ON ${getDateVal().toUpperCase()}. ${TRAILING_SENTENCE}`
  };

  // ---------- Pills: single-select, click copies message ----------
  let selectedPill = null;
  const pillEls = document.querySelectorAll('.pill');
  pillEls.forEach(pill => {
    if(!pill.classList.contains('payment-btn')) {
      pill.addEventListener('click', () => {
        const name = pill.dataset.name;
        pillEls.forEach(p => p.classList.remove('selected'));
        pill.classList.add('selected');
        selectedPill = name;
        const message = pillMessages[name]();
        copyText(message);
      });
    }
  });

  // ---------- LRP button ----------
  document.getElementById('lrpBtn').addEventListener('click', () => {
    if (!selectedPill) {
      showToast('Select a pill first');
      return;
    }
    let message = pillMessages[selectedPill]();
    message = message.replace(' ' + TRAILING_SENTENCE, '').replace(TRAILING_SENTENCE, '').trim();
    copyText(message);
  });

  // ---------- Email button ----------
  document.getElementById('emailBtn').addEventListener('click', () => {
    const bal = totalBalanceEl.value ? '$' + totalBalanceEl.value : '[balance]';
    const amount = monthlyEl.value ? '$' + monthlyEl.value : '[amount]';
    const date = getDateVal().toUpperCase();
    
    const appendText = `OUTSTANDING BALANCE: ${bal}\nMONTHLY PAYMENT: ${amount}\nSTART DATE: ${date}`;
    
    if (notesEl.value.trim() !== '') {
      notesEl.value = notesEl.value.trim() + '\n\n' + appendText;
    } else {
      notesEl.value = appendText;
    }
    
    showToast('Appended to Notes');
    notesEl.scrollTop = notesEl.scrollHeight;
  });

  // ---------- Clear button (Call Tab) ----------
  document.getElementById('clearBtn').addEventListener('click', () => {
    totalBalanceEl.value = '';
    totalBalanceEl.classList.remove('invalid');
    monthsEl.value = '';
    monthlyEl.value = '';
    resetStartDate();
    notesEl.value = '';
    pillEls.forEach(p => p.classList.remove('selected'));
    selectedPill = null;
    showToast('Data Cleared');
  });

  // ---------- Payment tab: NORM / REC ----------
  let lastKnownAmount = '';
  let lastKnownCode = '';

  function getPaymentAmount() {
    const match = paymentNotesEl.value.match(/AMOUNT\s*\$\s*([\d][\d,]*(?:\.\d{1,2})?)/i);
    // Strips commas out of the matched amount so $1,000.00 becomes $1000.00
    if (match) lastKnownAmount = match[1].replace(/,/g, ''); 
    return lastKnownAmount || '[amount]';
  }
  function getApprovalCode() {
    // Looks for exactly 6 alphanumeric characters (letters and/or numbers)
    const match = paymentNotesEl.value.match(/APPROVAL CODE[^a-zA-Z0-9]{0,15}([a-zA-Z0-9]{6})/i);
    if (match) lastKnownCode = match[1].toUpperCase();
    return lastKnownCode || '[approval code]';
  }
  function getTodayMD() {
    const d = new Date();
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  // Auto-strip commas physically from the text area when users paste values in the Paid tab notes
  paymentNotesEl.addEventListener('input', () => {
      const original = paymentNotesEl.value;
      // Replaces occurrences of commas specifically trapped inside dollar amounts
      const cleaned = original.replace(/(AMOUNT\s*\$\s*\d+),(\d{3}(?:\.\d{1,2})?)/gi, '$1$2');
      if (original !== cleaned) {
          paymentNotesEl.value = cleaned;
      }
  });

  // Click Norm
  document.getElementById('normBtn').addEventListener('click', () => {
    const message = `AWD took c card pmt $${getPaymentAmount()} auth ${getApprovalCode()} added ${getTodayMD()} MWF`;
    copyText(message);
  });

  // Click Rec
  document.getElementById('recBtn').addEventListener('click', () => {
    const up = upFieldEl.value || '[UP]';
    const pid = pidFieldEl.value || '[PID]';
    const message = `AWD took c card pmt $${getPaymentAmount()} auth ${getApprovalCode()} added ${getTodayMD()} MWF CC recouped to ${up} ${pid}`;
    copyText(message);
  });
  
  // ---------- PAYMENT TRACKER EXCEL LOGIC ----------
  let paymentTrackerData = JSON.parse(localStorage.getItem('myPaymentTracker')) || [];
  
  function saveToPaymentTracker() {
    // Format Date from Calendar Selection to M/D/YYYY
    let pDateStr = "";
    if (paymentDateBtnEl.value) {
      const dParts = paymentDateBtnEl.value.split('-'); // Breaks YYYY-MM-DD
      pDateStr = `${parseInt(dParts[1])}/${parseInt(dParts[2])}/${dParts[0]}`;
    }
    
    // Extract SSN strictly from the Notes text box (9 digits)
    const ssnMatch = paymentNotesEl.value.match(/\b\d{9}\b/);
    const ssnValue = ssnMatch ? ssnMatch[0] : '';
    
    // Extract PID from textbox, with fallback to 10 digits in Notes
    const pidFallback = paymentNotesEl.value.match(/\b\d{10}\b/);
    const pidValue = pidFieldEl.value || (pidFallback ? pidFallback[0] : '');
    
    const codeValue = codeFieldEl.value || '';
    const initialsVal = pdInitialsEl.value.trim().toUpperCase() || 'XXX';

    // Comment logic: if UP field has text -> Recoup. If empty -> Credit Card.
    const hasUpData = upFieldEl.value.trim().length > 0;
    const commentsVal = hasUpData ? `CC Recoup ${codeValue}`.trim() : 'Credit Card';

    // Create the Row
    const newRow = {
      "CC Conf #": getApprovalCode() === '[approval code]' ? '' : getApprovalCode(),
      "Amount": getPaymentAmount() === '[amount]' ? '' : getPaymentAmount(),
      "Payment Date": pDateStr,
      "From": fromFieldEl.value || '',
      "Agent": agentFieldEl.value || '',
      "Agent #": codeValue,
      "SSN": ssnValue,
      "Primary ID": pidValue,
      "Comments": commentsVal,
      "Processor": initialsVal 
    };

    paymentTrackerData.push(newRow);
    localStorage.setItem('myPaymentTracker', JSON.stringify(paymentTrackerData));
  }

  // Click Save to Tracker
  document.getElementById('savePaymentTrackerBtn').addEventListener('click', () => {
    saveToPaymentTracker();
    showToast('Saved to Tracker!');
  });

  // Download Payment Excel
  document.getElementById('downloadPaymentExcelBtn').addEventListener('click', () => {
    if (paymentTrackerData.length === 0) {
      showToast('No data to download.');
      return;
    }

    const worksheet = XLSX.utils.json_to_sheet(paymentTrackerData);
    
    // Calculate Column Widths (Auto-Fit)
    const colWidths = [];
    const keys = Object.keys(paymentTrackerData[0]);
    
    keys.forEach((key, colIndex) => {
      let maxWidth = key.length; // Start with header length
      paymentTrackerData.forEach(row => {
        const cellValue = row[key] ? String(row[key]) : "";
        if (cellValue.length > maxWidth) {
          maxWidth = cellValue.length;
        }
      });
      // Add a little padding to the width
      colWidths[colIndex] = { wch: maxWidth + 2 }; 
    });
    
    worksheet['!cols'] = colWidths;

    // Add styling (Left-Aligned and Header Color Fix)
    const range = XLSX.utils.decode_range(worksheet['!ref']);
    for (let R = range.s.r; R <= range.e.r; ++R) {
      for (let C = range.s.c; C <= range.e.c; ++C) {
        const cellAddress = XLSX.utils.encode_cell({ r: R, c: C }); 
        if (!worksheet[cellAddress]) continue;
        
        const isHeader = (R === 0);
        
        let cellStyle = {
          alignment: { horizontal: "left", vertical: "center" }
        };
        
        if (isHeader) {
          cellStyle.font = { bold: true };
          cellStyle.fill = {
            patternType: "solid",
            fgColor: { rgb: "ADD8E6" } // Light blue for Header
          };
        }
        
        worksheet[cellAddress].s = cellStyle;
      }
    }
    
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "CC Payments");

    // Format current date for file name: MM-DD-YYYY
    const d = new Date();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const yyyy = d.getFullYear();
    const dateStr = `${mm}-${dd}-${yyyy}`;
    
    // Grab initials, fallback to "XXX" if empty
    const initials = pdInitialsEl.value.trim().toUpperCase() || 'XXX';

    XLSX.writeFile(workbook, `${dateStr} CC PAYMENTS ${initials}.xlsx`);
  });

  // Clear Payment Tracker
  document.getElementById('resetPaymentTrackerBtn').addEventListener('click', () => {
    if (confirm('Are you sure you want to delete all saved Payment tracking data? This cannot be undone.')) {
      paymentTrackerData = [];
      localStorage.removeItem('myPaymentTracker');
      
      // Payment date ONLY clears out when Reset is clicked 
      paymentDateBtnEl.value = '';
      
      showToast('Payment Tracker Reset.');
    }
  });

  // ---------- Clear button (Payment Tab) ----------
  document.getElementById('clearPaymentBtn').addEventListener('click', () => {
    // Note: pdInitialsEl.value and paymentDateBtnEl.value are intentionally excluded here so they won't clear
    paymentNotesEl.value = '';
    upFieldEl.value = '';
    pidFieldEl.value = '';
    fromFieldEl.value = '';
    codeFieldEl.value = '';
    agentFieldEl.value = '';
    
    // reset animation classes if present
    pidFieldEl.classList.remove('invalid');
    
    lastKnownAmount = '';
    lastKnownCode = '';
    
    showToast('Data Cleared');
  });

  // ---------- Clear button (T&H Tab) ----------
  document.getElementById('clearThBtn').addEventListener('click', () => {
    thNotesEl.value = '';
    showToast('Data Cleared');
  });
</script>

</body>
</html>
